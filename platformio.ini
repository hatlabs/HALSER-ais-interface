; HALSER AIS Interface Firmware
; Matsutec HA-102 AIS transponder to NMEA 2000 / Signal K gateway

[platformio]
; halser_espidf builds ESP-IDF from source so sdkconfig is authoritative
; (CONFIG_MBEDTLS_DYNAMIC_BUFFER) -- required for a stable TLS Signal K
; connection on the C3. The plain `halser` (arduino, precompiled libs) ignores
; sdkconfig and fails TLS with MBEDTLS_ERR_SSL_ALLOC_FAILED; use it only for fast
; non-TLS compile checks via `-e halser`.
default_envs = halser_espidf

[env:halser]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
lib_ldf_mode = deep

upload_speed = 2000000
monitor_speed = 115200

lib_deps =
    SignalK/SensESP @ ^3.5.0
    SensESP/NMEA0183 @ ^3.2.1
    adafruit/Adafruit SSD1306 @ ^2.5.1
    ttlappalainen/NMEA2000-library @ ^4.17.2
    NMEA2000_twai=https://github.com/skarlsson/NMEA2000_twai
    ; SensESP includes <esp_websocket_client.h> unconditionally and the
    ; precompiled arduino framework bundles no copy, so this env fetches the
    ; component from the registry. halser_espidf takes it from
    ; src/idf_component.yml instead. Use the explicit 1.7.0 archive: the
    ; registry's object_id download form silently pinned 1.5.0, which still
    ; has the TLS recv-under-lock race that 1.7.0 fixed.
    esp_websocket_client=https://components-file.espressif.com/components/espressif/esp_websocket_client/1.7.0/espressif__esp_websocket_client-v1.7.0.zip
    pfeerick/elapsedMillis @ ^1.0.6

build_flags =
    -D SENSESP_BUTTON_PIN=9
    -D PIN_RGB_LED=8
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -D SENSESP_SSL_SUPPORT=1
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
    -D USE_ESP_IDF_LOG

build_unflags = -Werror=reorder
board_build.partitions = min_spiffs.csv
monitor_filters = esp32_exception_decoder

; espidf+arduino dual-framework build. Building ESP-IDF from source makes
; sdkconfig authoritative, which lets us enable CONFIG_MBEDTLS_DYNAMIC_BUFFER
; (see sdkconfig.defaults) -- impossible with the precompiled Arduino libs
; [env:halser] uses. That dynamic TLS buffer is the memory win that keeps the
; TLS Signal K connection stable on the ESP32-C3.
[env:halser_espidf]
extends = env:halser
framework = espidf, arduino
; Same as env:halser minus esp_websocket_client, which this env takes from
; src/idf_component.yml (pinned in dependencies.lock).
lib_deps =
    SignalK/SensESP @ ^3.5.0
    SensESP/NMEA0183 @ ^3.2.1
    adafruit/Adafruit SSD1306 @ ^2.5.1
    ttlappalainen/NMEA2000-library @ ^4.17.2
    NMEA2000_twai=https://github.com/skarlsson/NMEA2000_twai
    pfeerick/elapsedMillis @ ^1.0.6
; esp_insights and esp_rainmaker are pulled in transitively by arduino-esp32 on
; esp32c3 and require their server certs embedded, even though this firmware
; uses neither cloud service.
board_build.embed_txtfiles =
    managed_components/espressif__esp_insights/server_certs/https_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
    managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

; Host-side unit tests for the framework-agnostic AIS decoder (src/ais/).
; Run with: pio test -e native
[env:native]
platform = native
build_flags = -std=c++17 -I src
lib_compat_mode = off
build_src_filter = -<*> +<ais/>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
test_framework = unity
